spring:
  application:
    name: pokedex
  datasource:
    # CORREGIDO: Cambiamos localhost por db-postgres (el nombre en tu docker-compose)
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}?createDatabaseIfNotExist=true
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# CONFIGURACIÓN DE SWAGGER (SPRINGDOC) PARA EVITAR ERROR 500 V2
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Forzamos a que el buscador use la ruta interna de tu Spring Boot
    url: /v3/api-docs
    disable-swagger-default-url: true
  packages-to-scan: com.alex.pokedex